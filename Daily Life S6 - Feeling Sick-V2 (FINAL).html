<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Life Scene 6: Role Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--mint:#d8efe6;--teal:#1f7a6d;--navy:#16324a;--paper:#fbfaf6;--coral:#e8604c;--line:#b9d9cd}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;background:var(--mint);color:var(--navy)}
header{padding:12px 20px;background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:1.25rem;font-weight:900}
header span{font-size:.9rem;opacity:.9}
main{display:flex;flex-wrap:wrap;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.stage{flex:2 1 520px;min-width:0}
.screen{position:relative;background:#0e1d2a;border-radius:14px;overflow:hidden;aspect-ratio:16/9;border:4px solid #fff}
canvas{width:100%;height:100%;display:block;object-fit:contain}
video{display:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px;background:rgba(14,29,42,.85)}
.overlay p{margin:0;max-width:34ch;line-height:1.5}
button{font:inherit;cursor:pointer;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:8px 12px;font-weight:700}
button:hover{background:#eef8f3}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button.primary{background:var(--coral);border-color:var(--coral);color:#fff;font-size:1.1rem;padding:12px 24px}
button.on{background:var(--navy);color:#fff}
.side{flex:1 1 300px;display:flex;flex-direction:column;gap:14px}
.dialog{order:1}.row{order:2}.grid{order:3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{text-align:left;line-height:1.2;padding:8px 10px}
.grid small{display:block;font-weight:500;opacity:.75}
.dialog{background:var(--paper);border:3px solid var(--navy);border-radius:14px;padding:14px 16px;font-size:1.15rem;line-height:1.55}
.dialog b{color:var(--teal)}
.dialog .who{font-weight:900;margin-right:6px}
.dialog .hide{filter:blur(8px);user-select:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.85rem;min-height:1.2em}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22vw;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
.flash.on{opacity:.9;transition:none}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.shots canvas{width:150px;height:auto;border:3px solid #fff;border-radius:8px;cursor:pointer;background:#000}
.lightbox{position:fixed;inset:0;background:rgba(14,29,42,.92);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;cursor:pointer}
.lightbox canvas{max-width:100%;max-height:100%;border-radius:10px}

header .spacer{flex:1}
.pill{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 12px;font-size:.85rem}
header button{padding:4px 10px;font-size:.85rem}
.menu{max-width:780px;margin:24px auto;padding:0 16px;text-align:center}
.menu h2{margin:18px 0 8px}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.choice{padding:16px;line-height:1.3}
.choice small{display:block;font-weight:500;opacity:.8;margin-top:4px}
.choice.on{background:var(--navy);color:#fff}
.menu .primary{margin-top:22px}
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:3px solid var(--navy);border-radius:14px;padding:12px 14px;cursor:pointer;margin-bottom:10px}
.goal.done{background:#e3f5ea;border-color:var(--teal)}
.goal .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.goal.done .num{background:var(--teal)}
.goal .jp{font-size:.85rem;opacity:.75}
.goal .t{font-size:1.1rem;font-weight:900}
.step{margin-top:6px;font-size:1.05rem}
.step.kw{display:inline-block;background:var(--coral);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;margin-right:6px}
.step.frame{color:var(--teal);font-weight:700}
.step.full{font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:6px 14px}
.chip.used{background:var(--teal);color:#fff;border-color:var(--teal)}
.bank h3{margin:4px 0 8px;font-size:1rem}
.note{background:#fff;border-radius:10px;padding:10px 14px;font-size:.95rem}
.ans{background:var(--paper);border:3px solid var(--coral);border-radius:12px;padding:10px 14px;font-size:1.1rem}
.modal{position:fixed;inset:0;background:rgba(14,29,42,.85);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .box{background:var(--paper);border-radius:16px;padding:24px;max-width:420px;text-align:center}
.modal .box h2{margin:0 0 8px}
.modal .stars{font-size:2rem;margin:6px 0 14px}
.modal .row{justify-content:center}
main.cathy .stage,main.cathy .mk{display:none}
main.cathy .side{flex:1 1 100%;max-width:720px;margin:0 auto}

main.makoto .side{display:none}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bank h2{margin:0 0 12px}
.chip{font-size:1.2rem;padding:10px 18px}

.ctrl{justify-content:center;margin-top:14px}
.shutter{width:78px;height:78px;border-radius:50%;border:6px solid #fff;background:var(--coral);box-shadow:0 0 0 4px var(--navy);padding:0;font-size:1.9rem;line-height:1}
.shutter:hover{background:#d9503c}
#retake{font-size:1.1rem;padding:12px 26px}

/* compact layout for 11-inch Chromebooks */
header{padding:6px 14px}
header h1{font-size:1.05rem}
header span{font-size:.8rem}
main{padding:8px 12px;gap:10px}
main.makoto .stage{flex:1 1 100%}
.screen{width:min(100%,calc((100vh - 175px)*16/9));margin:0 auto;border-width:3px;border-radius:10px}
.ctrl{margin-top:8px}
.shutter{width:60px;height:60px;border-width:5px;font-size:1.5rem}
#retake{padding:8px 20px;font-size:1rem}
.status{margin:4px 0;text-align:center}
#info{min-height:0;margin:2px 0}
.overlay{gap:6px;padding:10px;font-size:.9rem}
.overlay .primary{font-size:1rem;padding:8px 18px}
.offer{margin-top:14px;background:#fff;border:3px solid var(--coral);border-radius:14px;padding:12px 16px;font-size:1.3rem;line-height:1.5}
.offer .adv{font-weight:900;color:var(--teal)}
.offer .lead{color:var(--coral);font-weight:700}
.offer .arr{opacity:.6}
.bank .step2{margin-top:18px}
.offer{font-weight:900;font-size:1.4rem;min-height:3.2rem;display:flex;align-items:center}
.offer.empty{font-weight:500;color:#7d98a6;border-style:dashed}
body{background:linear-gradient(180deg,#d8efe6,#eef8f3);background-attachment:fixed;min-height:100vh}
.menu{max-width:860px;margin:14px auto;padding:0 16px;text-align:center}
.hero{background:#fff;border:3px solid var(--navy);border-radius:16px;overflow:hidden;text-align:left}
.titlebar{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px}
.titlebar .dl{font-size:1.6rem;font-weight:900}
.titlebar .sc{opacity:.9}.titlebar .sc b{font-size:1.5rem}
.titlebar .bub{margin-left:auto;background:var(--coral);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.topic{padding:6px 16px;font-size:1.5rem;font-weight:900;border-bottom:2px solid var(--line)}
.goal{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#f3faf6;flex-wrap:wrap}
.goal .tag{background:var(--teal);color:#fff;font-weight:900;padding:2px 12px;border-radius:6px}
.goal .sk{font-weight:900;color:var(--teal)}
.goal .gt{font-size:.95rem}
.pick{margin:18px 0 12px;font-size:1.3rem}
.roles{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.role{width:250px;padding:16px 14px;border-radius:20px;border:4px solid var(--navy);background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 var(--navy);transition:transform .15s}
.role:hover{transform:translateY(-3px);background:#fff}
.role .av{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;background:#dff1ff;border:4px solid #fff;box-shadow:0 0 0 3px var(--navy)}
.role.makoto .av{background:#ffe3dc}
.role .nm{font-size:1.7rem;font-weight:900}
.role .ds{font-size:1rem;opacity:.8}
.role.on,.role.on:hover{background:var(--navy);color:#fff;box-shadow:0 6px 0 var(--coral)}
.menu .primary{margin-top:22px;font-size:1.3rem;padding:12px 56px}
.floaters{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:1.8rem}
.floaters span{animation:bob 2.4s ease-in-out infinite}
.floaters span:nth-child(2n){animation-delay:.4s}
.floaters span:nth-child(3n){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.floaters span{animation:none}}
.bank .step2{margin-top:38px}
.chip{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;padding:6px 14px;font-size:1.15rem}
.chip small{font-size:.72rem;font-weight:500;opacity:.75}
.offer{flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.3}
.offer small{display:block;font-size:.9rem;font-weight:500;color:#5a7686;margin-top:2px}
</style>
</head>
<body>
<header>
  <h1>Daily Life</h1><span>Scene 6 · 体調不良</span><div class="spacer"></div>
  <span class="pill" id="pRole" hidden></span>
  <button id="swap" hidden>Swap roles</button>
  <button id="toMenu" hidden>Menu</button>
</header>

<div class="menu" id="menu">
  <div class="hero">
    <div class="titlebar"><span class="dl">Daily Life</span><span class="sc">Scene <b>6</b></span><span class="bub" aria-hidden="true">💬</span></div>
    <div class="topic">体調不良</div>
    <div class="goal"><span class="tag">Goal</span><span class="sk">Speak</span><span class="gt">友達の体調をたずねたり、助言をしたりすることができる。</span></div>
  </div>
  <h2 class="pick">Choose your role</h2>
  <div class="roles">
    <button class="role cathy" data-role="cathy"><span class="av">👧</span><span class="nm">Cathy</span><span class="ds">Give advice</span></button>
    <button class="role makoto" data-role="makoto"><span class="av">👦</span><span class="nm">Makoto</span><span class="ds">Camera</span></button>
  </div>
  <button class="primary" id="begin">Start</button>
  <div class="floaters" aria-hidden="true"><span>🤒</span><span>🤕</span><span>🤧</span><span>😷</span><span>🥵</span><span>🦟</span></div>
</div>

<main id="game" hidden>
  <section class="stage" id="stage">
    <div class="screen">
      <canvas id="c" width="1280" height="720"></canvas>
      <video id="v" playsinline muted></video>
      <div class="flash" id="flash"></div>
      <div class="overlay" id="start">
        <p><strong>Your camera stays on this Chromebook.</strong><br>No photos or videos are saved or sent.</p>
        <button class="primary" id="go">Start camera</button>
        <p class="status" id="msg"></p>
      </div>
    </div>
    <div class="ctrl">
      <button class="shutter" id="shutter" aria-label="Take photo">📷</button>
      <button id="retake" hidden>↺ Retake</button>
    </div>
    <p class="status" id="info"></p>
  </section>
  <aside class="side">
    <div class="bank"><h2>Step 1: Advice</h2><div class="chips" id="chips"></div><h2 class="step2">Step 2: Offer help</h2><div class="offer" id="offer"></div></div>
  </aside>
</main>

<script type="module">
import {FaceLandmarker,HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $=id=>document.getElementById(id);
const V=$('v'),C=$('c'),ctx=C.getContext('2d');

const ILL=[
 {id:'dizzy',cap:'feel dizzy'},{id:'fever',cap:'have a fever'},{id:'headache',cap:'have a headache'},
 {id:'stomach',cap:'have a stomachache'},{id:'nosebleed',cap:'have a nosebleed'},{id:'runny',cap:'have a runny nose'},
 {id:'cut',cap:'cut my finger'},{id:'toothache',cap:'have a toothache'},{id:'cold',cap:'have a cold'},
 {id:'blackeye',cap:'have a black eye'},{id:'bump',cap:'have a bump on the head'},{id:'sunburn',cap:'have sunburn'},
 {id:'hayfever',cap:'have hay fever'},{id:'earache',cap:'have an earache'},{id:'bite',cap:'have an insect bite'}
];
const want=(new URLSearchParams(location.search).get('ill')||'').split(',').filter(Boolean);
let POOL=want.length?ILL.filter(i=>want.includes(i.id)):ILL;
if(!POOL.length)POOL=ILL;

let cur=null,landmarker=null,lm=null,lastT=-1;
let fsRes=null,handLandmarker=null,handLoading=false,handLm=null,lastH=-1;
let role=null,selRole='makoto';
let frozen=false;const shot=document.createElement('canvas');

/* ---------- Camera + face tracking ---------- */
$('go').onclick=async()=>{
  $('go').disabled=true;$('msg').textContent='Starting camera…';
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    V.srcObject=s;await V.play();
  }catch(e){
    $('msg').textContent='The camera is blocked. Click the camera icon in the address bar and choose Allow, or ask your teacher.';
    $('go').disabled=false;return;
  }
  $('start').hidden=true;
  $('info').textContent='Loading face tracking…';
  requestAnimationFrame(frame);
  loadTracker();
};
async function loadTracker(){
  if(landmarker){$('info').textContent='';return;}
  try{
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");fsRes=fs;
    const model="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
    for(const d of ["GPU","CPU"]){
      try{landmarker=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:"VIDEO",numFaces:1});break;}catch(e){}
    }
    $('info').textContent=landmarker?'':'Face tracking did not load. Effects will appear in the middle of the screen.';
  }catch(e){$('info').textContent='Face tracking did not load. Effects will appear in the middle of the screen.';}
}

async function loadHand(){
  handLoading=true;$('info').textContent='Loading hand tracking…';
  const model="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  for(const d of ["GPU","CPU"]){
    try{handLandmarker=await HandLandmarker.createFromOptions(fsRes,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:"VIDEO",numHands:1});break;}catch(e){}
  }
  $('info').textContent=handLandmarker?'':'Hand tracking did not load. Try reloading the page.';
}

/* ---------- Geometry ---------- */
function face(w,h){
  if(!lm){return{ok:false,cx:w/2,cy:h*.45,rx:w*.14,ry:w*.18,top:{x:w/2,y:h*.45-w*.18},chin:{x:w/2,y:h*.45+w*.18},
    lt:{x:w/2-w*.12,y:h*.3},rt:{x:w/2+w*.12,y:h*.3},lc:{x:w/2-w*.09,y:h*.5},rc:{x:w/2+w*.09,y:h*.5},
    le:{x:w/2-w*.06,y:h*.4},re:{x:w/2+w*.06,y:h*.4},mo:{x:w/2,y:h*.56},no:{x:w/2,y:h*.49},nl:{x:w/2-w*.015,y:h*.49},nr:{x:w/2+w*.015,y:h*.49}};}
  const P=i=>({x:(1-lm[i].x)*w,y:lm[i].y*h});
  const avg=(a,b)=>{const p=P(a),q=P(b);return{x:(p.x+q.x)/2,y:(p.y+q.y)/2}};
  const T=P(10),B=P(152),L=P(234),R=P(454);
  return{ok:true,cx:(L.x+R.x)/2,cy:(T.y+B.y)/2,rx:Math.abs(R.x-L.x)/2,ry:Math.abs(B.y-T.y)/2,top:T,chin:B,
    lt:P(54),rt:P(284),lc:P(205),rc:P(425),le:avg(33,133),re:avg(362,263),mo:P(14),no:P(2),nl:P(98),nr:P(327)};
}

/* ---------- Drawing helpers ---------- */
function video(dx=0,dy=0,filter='none',alpha=1){
  const w=C.width,h=C.height;
  ctx.save();ctx.globalAlpha=alpha;ctx.filter=filter;ctx.translate(w+dx,dy);ctx.scale(-1,1);ctx.drawImage(V,0,0,w,h);ctx.restore();
}
function faceGlow(f,color,a,scale=1.05){
  const g=ctx.createRadialGradient(f.cx,f.cy,f.ry*.15,f.cx,f.cy,f.ry*scale);
  g.addColorStop(0,color.replace('A',a));g.addColorStop(.75,color.replace('A',a*.8));g.addColorStop(1,color.replace('A',0));
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(f.cx,f.cy,f.rx*1.15,f.ry*1.05,0,0,Math.PI*2);ctx.fill();
}
function blob(x,y,r,color,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color.replace('A',a));g.addColorStop(1,color.replace('A',0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function emoji(ch,x,y,size,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,0,0);ctx.restore();
}
function spiral(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.beginPath();for(let a=0;a<Math.PI*6;a+=.2){const rr=r*a/(Math.PI*6);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
  ctx.lineWidth=Math.max(2,r*.12);ctx.strokeStyle='#16324a';ctx.stroke();ctx.restore();
}

function bulge(x,y,r,k,filter='none'){
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  ctx.translate(x,y);ctx.scale(k,k);ctx.translate(-x,-y);video(0,0,filter);ctx.restore();
}
function ring(x,y,r,color){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,r*.12);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore();}
function shout(str,x,y,size){
  ctx.save();ctx.font=`900 ${size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=size*.14;ctx.strokeStyle='#e8604c';ctx.fillStyle='#fff';
  ctx.strokeText(str,x,y);ctx.fillText(str,x,y);ctx.restore();
}
const topY=f=>Math.max(f.rx*.45,f.top.y-f.ry*.1);

/* ---------- Effects ---------- */
const FX={
 pale(f,t){
  video(0,0,'saturate(.2) brightness(1.18) contrast(.85)');
  faceGlow(f,'rgba(205,222,245,A)',.45);
  blob(f.cx,f.cy+f.ry*.1,f.rx*1.6,'rgba(120,140,180,A)',.12);
 },
 dizzy(f,t){
  video(0,0,'blur(1.5px) saturate(.9)');
  video(Math.sin(t*2.6)*C.width*.025,Math.cos(t*2.1)*C.height*.012,'blur(2px)',.4);
  [f.le,f.re].forEach(e=>{blob(e.x,e.y,f.rx*.3,'rgba(255,255,255,A)',.7);spiral(e.x,e.y,f.rx*.2,t*6);});
  for(let i=0;i<5;i++){const a=t*2.2+i*Math.PI*2/5;
    emoji('⭐',f.cx+Math.cos(a)*f.rx*1.05,f.top.y-f.ry*.02+Math.sin(a)*f.ry*.16,f.rx*.3);}
 },
 fever(f,t){
  video(0,0,'sepia(.35) saturate(1.8) hue-rotate(-12deg)');
  faceGlow(f,'rgba(255,50,30,A)',.35);
  [f.lc,f.rc].forEach(c=>blob(c.x,c.y,f.rx*.55,'rgba(255,40,40,A)',.55));
  for(let i=0;i<3;i++){const p=(t*.45+i/3)%1;
    emoji('💧',f.top.x+(i-1)*f.rx*.6,f.top.y+f.ry*.1+p*f.ry*.9,f.rx*.22);}
  emoji('🌡️',f.mo.x+f.rx*.35,f.mo.y,f.rx*.55,-.7);
 },
 headache(f,t){
  video(0,0,'brightness(.88) contrast(1.05)');
  const p=(Math.sin(t*5)+1)/2,w=C.width,h=C.height;
  const v=ctx.createRadialGradient(w/2,h/2,h*.25,w/2,h/2,h*.85);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,w,h);
  [f.lt,f.rt].forEach(c=>blob(c.x,c.y,f.rx*(.55+.35*p),'rgba(255,40,30,A)',.3+.45*p));
  emoji('💢',f.lt.x-f.rx*.2,f.lt.y-f.ry*.15,f.rx*(.3+.12*p));

 },
 nosebleed(f,t){
  video(0,0,'saturate(.85) brightness(1.05)');
  const lw=Math.max(3,f.rx*.06),len=f.ry*(.3+.08*Math.sin(t*2));

  [f.nl,f.nr].forEach(n=>{
    const ex=n.x+(f.mo.x-n.x)*.3,ey=Math.min(n.y+len,f.mo.y-lw);

    ctx.fillStyle='rgba(165,0,12,.95)';ctx.beginPath();ctx.arc(ex,ey,lw*.75,0,Math.PI*2);ctx.fill();
  });
  for(let i=0;i<3;i++){const p=(t*.6+i/3)%1;
    ctx.fillStyle=`rgba(175,0,12,${1-p*.5})`;ctx.beginPath();ctx.arc(f.no.x+(i-1)*lw*1.4,f.mo.y+p*f.ry*.9,lw*.8*(1-p*.4),0,Math.PI*2);ctx.fill();}

 },
 runny(f,t){
  video(0,0,'saturate(1.1)');

    const ex=n.x,ey=n.y+len;

    ctx.fillStyle='rgba(200,240,160,.85)';ctx.beginPath();ctx.arc(ex,ey,lw*(.9+.5*p),0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(ex-lw*.3,ey-lw*.3,lw*.3,0,Math.PI*2);ctx.fill();

 cut(f,t){
  video();
  if(!handLm){
    const w=C.width,h=C.height,fs=Math.round(h*.05);

  }
  const P=i=>({x:(1-handLm[i].x)*C.width,y:handLm[i].y*C.height});
  const tip=P(8),dip=P(7),pip=P(6),u=Math.hypot(tip.x-pip.x,tip.y-pip.y)||40;
  const m={x:(tip.x+dip.x)/2,y:(tip.y+dip.y)/2};
  const a=Math.atan2(tip.y-dip.y,tip.x-dip.x)+Math.PI/2,d=u*.22;
  blob(m.x,m.y,u*.4,'rgba(200,0,15,A)',.6);

  ctx.strokeStyle='#a5000f';ctx.lineWidth=Math.max(3,u*.05);
  ctx.beginPath();ctx.moveTo(m.x-Math.cos(a)*d,m.y-Math.sin(a)*d);ctx.lineTo(m.x+Math.cos(a)*d,m.y+Math.sin(a)*d);ctx.stroke();
  for(let i=0;i<3;i++){const p=(t*.7+i/3)%1;
    ctx.fillStyle=`rgba(180,0,15,${1-p*.6})`;ctx.beginPath();ctx.arc(m.x+(i-1)*u*.09,m.y+u*.12+p*u*1.4,u*.07*(1-p*.4),0,Math.PI*2);ctx.fill();}

 },
 toothache(f,t){
  video();
  const c=f.lc,r=f.rx*.55,k=1.3+.07*Math.sin(t*3);

  blob(c.x,c.y,r*1.1,'rgba(255,60,60,A)',.25);

 },
 cold(f,t){
  const cyc=t%2.4,cough=cyc<.5,q=cyc/.5;
  video(cough?Math.sin(t*60)*C.width*.006:0,cough?Math.abs(Math.sin(t*40))*4:0,'saturate(.7) brightness(.95)');
  blob(f.no.x,f.no.y-f.ry*.05,f.rx*.45,'rgba(255,70,70,A)',.5);
  const y0=f.no.y+f.ry*.02,yc=f.chin.y-f.ry*.04,ey=f.le.y+f.ry*.15;
  ctx.save();ctx.fillStyle='rgba(238,246,250,.96)';ctx.strokeStyle='rgba(120,150,170,.9)';ctx.lineWidth=Math.max(2,f.rx*.03);
  ctx.beginPath();ctx.moveTo(f.cx-f.rx*.85,y0);ctx.quadraticCurveTo(f.cx,y0-f.ry*.06,f.cx+f.rx*.85,y0);

  for(let i=1;i<=3;i++){const y=y0+(yc-y0)*i/4,w=f.rx*(.8-.07*i);ctx.beginPath();ctx.moveTo(f.cx-w,y);ctx.lineTo(f.cx+w,y);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(f.cx-f.rx*.85,y0);ctx.lineTo(f.cx-f.rx*1.02,ey);ctx.moveTo(f.cx+f.rx*.85,y0);ctx.lineTo(f.cx+f.rx*1.02,ey);ctx.stroke();
  ctx.restore();
  for(let i=0;i<3;i++){const a=t*1.5+i*2.1;emoji('🦠',f.cx+Math.cos(a)*f.rx*1.5,f.cy+Math.sin(a)*f.ry*.9,f.rx*.22);}
  if(cough){
    ctx.save();ctx.globalAlpha=1-q*.6;
    for(let i=0;i<4;i++)emoji('💨',f.mo.x+(i-1.5)*f.rx*.7*(.4+q),f.mo.y+f.ry*.1+q*f.ry*.9,f.rx*.4);
    ctx.restore();shout('Cough!',f.cx,topY(f),f.rx*.5);
  }
 },
 blackeye(f,t){
  video();
  const e=f.le,r=f.rx*.42;
  bulge(e.x,e.y,r,1.18);
  blob(e.x,e.y,r*1.25,'rgba(110,130,40,A)',.35);
  blob(e.x,e.y,r*.95,'rgba(60,15,90,A)',.8);
  blob(e.x,e.y,r*.5,'rgba(25,5,45,A)',.55);
  const cyc=t%3.2;
  if(cyc<.6){const q=cyc/.6;
    if(q<.75)emoji('🥊',e.x-f.rx*(2.2-1.6*(q/.75)),e.y,f.rx*.7);
    else{emoji('💥',e.x,e.y,f.rx*(.6+.4*(q-.75)*4));}
  }
 },
 bump(f,t){
  video();
  const c={x:f.top.x+f.rx*.35,y:f.top.y+f.ry*.22},r=f.rx*.38;
  bulge(c.x,c.y,r,1.7+.08*Math.sin(t*3));
  blob(c.x,c.y,r*1.2,'rgba(255,90,70,A)',.35);
  ring(c.x,c.y,r,'rgba(190,60,60,.45)');
  ctx.save();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(c.x-r*.3,c.y-r*.35,r*.22,r*.12,-.6,0,Math.PI*2);ctx.fill();ctx.restore();
  for(let i=0;i<5;i++){const a=t*3+i*Math.PI*2/5;emoji('💫',f.cx+Math.cos(a)*f.rx*1.05,f.top.y+Math.sin(a)*f.ry*.16,f.rx*.28);}
 },
 sunburn(f,t){
  video(0,0,'sepia(.5) saturate(2.4) hue-rotate(-20deg) brightness(1.05)');
  faceGlow(f,'rgba(255,40,20,A)',.45);
  [f.lc,f.rc,f.no].forEach(c=>blob(c.x,c.y,f.rx*.5,'rgba(255,30,30,A)',.5));
  for(let i=0;i<3;i++){const p=(t*.45+i/3)%1;emoji('💧',f.top.x+(i-1)*f.rx*.6,f.top.y+f.ry*.1+p*f.ry*.9,f.rx*.22);}
  emoji('☀️',f.cx+f.rx*1.5,topY(f)+f.rx*.2,f.rx*.9,t*.5);

 },
 hayfever(f,t){
  const cyc=t%2.6,sneeze=cyc<.45;
  video(sneeze?Math.sin(t*70)*C.width*.012:0,sneeze?Math.abs(Math.sin(t*35))*8:0,'saturate(1.1)');
  [f.le,f.re].forEach((e,k)=>{
    blob(e.x,e.y,f.rx*.3,'rgba(255,40,60,A)',.45);
    for(let i=0;i<2;i++){const p=(t*.5+i*.5+k*.25)%1;emoji('💧',e.x+(i?1:-1)*f.rx*.05,e.y+p*f.ry*.6,f.rx*.2);}
  });
  blob(f.no.x,f.no.y-f.ry*.05,f.rx*.45,'rgba(255,70,70,A)',.5);
  ctx.save();ctx.fillStyle='rgba(250,210,40,.85)';
  for(let i=0;i<30;i++){const x=(i*131+t*(25+(i%5)*10))%C.width,y=(i*71+Math.sin(t*1.5+i)*30+t*(8+(i%4)*6))%C.height;
    ctx.beginPath();ctx.arc(x,y,3+i%3,0,Math.PI*2);ctx.fill();}
  ctx.restore();
  emoji('🌼',f.cx+f.rx*1.4,f.top.y+f.ry*.3,f.rx*.4);

 },
 earache(f,t){
  video();
  const ex=f.cx+f.rx*1.02,ey=f.le.y+f.ry*.15,p=(Math.sin(t*6)+1)/2;
  blob(ex,ey,f.rx*(.45+.2*p),'rgba(255,30,30,A)',.35+.4*p);
  emoji('🔔',ex+f.rx*.55,ey-f.ry*.15,f.rx*.5,Math.sin(t*18)*.4);
  emoji('❗',ex+f.rx*.85,ey+f.ry*.2,f.rx*.3);
 },
 bite(f,t){
  video();
  const c=f.rc,r=f.rx*.32;
  bulge(c.x,c.y,r,1.9);
  blob(c.x,c.y,r*1.3,'rgba(255,60,60,A)',.55);
  ring(c.x,c.y,r,'rgba(190,50,50,.5)');

 stomach(f,t){
  video(0,0,'saturate(.7) hue-rotate(45deg) brightness(.95)');

/* ---------- Main loop ---------- */
function frame(){
  if(role!=='makoto'||!V.srcObject)return;
  requestAnimationFrame(frame);
  if(V.readyState<2||!V.videoWidth)return;
  if(C.width!==V.videoWidth||C.height!==V.videoHeight){C.width=V.videoWidth;C.height=V.videoHeight;}
  if(frozen){ctx.drawImage(shot,0,0);return;}
  if(landmarker&&V.currentTime!==lastT){
    lastT=V.currentTime;
    try{const r=landmarker.detectForVideo(V,performance.now());lm=r.faceLandmarks&&r.faceLandmarks[0]||null;}catch(e){lm=null;}
  }
  if(cur&&cur.id==='cut'){
    if(!handLandmarker&&fsRes&&!handLoading)loadHand();
    if(handLandmarker&&V.currentTime!==lastH){
      lastH=V.currentTime;
      try{const r=handLandmarker.detectForVideo(V,performance.now());handLm=r.landmarks&&r.landmarks[0]||null;}catch(e){handLm=null;}
    }
  }
  const f=face(C.width,C.height),t=performance.now()/1000;
  if(cur){FX[cur.id](f,t);}else{video();}
  ctx.filter='none';ctx.globalAlpha=1;
}






/* ---------- Game ---------- */
function caption(x){
  const w=x.canvas.width,h=x.canvas.height,fs=Math.round(h*.09);
  x.save();x.font=`900 ${fs}px "Zen Maru Gothic",sans-serif`;x.textAlign='center';x.textBaseline='middle';
  const tw=x.measureText(cur.cap).width+fs*1.2;
  x.fillStyle='rgba(22,50,74,.88)';x.fillRect((w-tw)/2,h-fs*1.9,tw,fs*1.4);
  x.fillStyle='#fff';x.fillText(cur.cap,w/2,h-fs*1.2);x.restore();
}
function newRound(){
  let n;do{n=POOL[Math.floor(Math.random()*POOL.length)]}while(POOL.length>1&&n===cur);
  cur=n;frozen=false;$('shutter').hidden=false;$('retake').hidden=true;
}
$('shutter').onclick=()=>{
  if(!V.srcObject||!$('start').hidden||frozen||!cur)return;
  shot.width=C.width;shot.height=C.height;
  const x=shot.getContext('2d');x.drawImage(C,0,0);caption(x);
  frozen=true;$('shutter').hidden=true;$('retake').hidden=false;
  const fl=$('flash');fl.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>fl.classList.remove('on')));
};
$('retake').onclick=newRound;

const ADVICE=[
 ["go home","take you to your homeroom teacher?","家に帰る","担任の先生のところへ連れていきましょうか？"],
 ["see a doctor","call your parents?","医者に診てもらう","お家の人に電話しましょうか？"],
 ["lie down in bed","take you to the nurse's office?","ベッドで横になる","保健室に連れていきましょうか？"],
 ["call a teacher","go to the teachers' room with you?","先生を呼ぶ","職員室に一緒に行きましょうか？"],
 ["take a rest","take you to the school nurse's office?","休む","保健室に連れていきましょうか？"],
 ["drink some water","get you some water?","水を飲む","水を持ってきましょうか？"],
 ["put ice on it","get some ice for you?","氷で冷やす","氷を持ってきましょうか？"],
 ["use a tissue","give you a tissue?","ティッシュを使う","ティッシュをあげましょうか？"],

 ["wash it","take you to the sink?","洗う","水道まで連れていきましょうか？"],
 ["stay in the shade","take you to a shady place?","日陰にいる","日陰に連れていきましょうか？"],
 ["take some medicine","get some medicine for you?","薬を飲む","薬を持ってきましょうか？"],
 ["put cream on it","get some cream for you?","クリームを塗る","クリームを持ってきましょうか？"],
 ["sit down and lean forward","get some tissues for you?","座って前かがみになる","ティッシュを持ってきましょうか？"],
 ["go to the nurse's office","go with you?","保健室に行く","一緒に行きましょうか？"]
];
let sel=null;
function renderChips(){
  const ch=$('chips');ch.innerHTML='';
  ADVICE.forEach(([a,,jp])=>{
    const b=document.createElement('button');b.className='chip'+(sel===a?' used':'');
    b.innerHTML=`<span>${a}</span><small>${jp}</small>`;
    b.onclick=()=>{sel=sel===a?null:a;renderChips();};ch.appendChild(b);
  });
  const box=$('offer'),item=ADVICE.find(x=>x[0]===sel);
  box.innerHTML=item?`<span>${item[1]}</span><small>${item[3]}</small>`:`<span>Choose advice in Step 1.</span><small>ステップ1でアドバイスを選ぼう</small>`;
  box.classList.toggle('empty',!item);
}

function stopCam(){
  if(V.srcObject){V.srcObject.getTracks().forEach(t=>t.stop());V.srcObject=null;}
  lm=null;handLm=null;frozen=false;$('info').textContent='';
}
function enterRole(){
  $('menu').hidden=true;$('game').hidden=false;$('game').className=role;
  $('pRole').textContent=role==='cathy'?'Cathy':'Makoto';
  ['pRole','swap','toMenu'].forEach(i=>$(i).hidden=false);
  if(role==='makoto'){
    if(!V.srcObject){$('start').hidden=false;$('go').disabled=false;$('msg').textContent='';}
    newRound();
  }else{stopCam();sel=null;renderChips();}
}
$('swap').onclick=()=>{role=role==='cathy'?'makoto':'cathy';enterRole();};

document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
  selRole=b.dataset.role;
  document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x===b));
});
document.querySelector('[data-role="'+selRole+'"]').classList.add('on');
$('begin').onclick=()=>{role=selRole;enterRole();};
$('toMenu').onclick=()=>{stopCam();role=null;$('game').hidden=true;$('menu').hidden=false;['pRole','swap','toMenu'].forEach(i=>$(i).hidden=true);};
</script>

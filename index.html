<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse's Office: Illness Face Filter v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--mint:#d8efe6;--teal:#1f7a6d;--navy:#16324a;--paper:#fbfaf6;--coral:#e8604c;--line:#b9d9cd}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;background:var(--mint);color:var(--navy)}
header{padding:12px 20px;background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:1.25rem;font-weight:900}
header span{font-size:.9rem;opacity:.9}
main{display:flex;flex-wrap:wrap;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.stage{flex:2 1 520px;min-width:0}
.screen{position:relative;background:#0e1d2a;border-radius:14px;overflow:hidden;aspect-ratio:16/9;border:4px solid #fff}
canvas{width:100%;height:100%;display:block;object-fit:contain}
video{display:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px;background:rgba(14,29,42,.85)}
.overlay p{margin:0;max-width:34ch;line-height:1.5}
button{font:inherit;cursor:pointer;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:8px 12px;font-weight:700}
button:hover{background:#eef8f3}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button.primary{background:var(--coral);border-color:var(--coral);color:#fff;font-size:1.1rem;padding:12px 24px}
button.on{background:var(--navy);color:#fff}
.side{flex:1 1 300px;display:flex;flex-direction:column;gap:14px}
.dialog{order:1}.row{order:2}.grid{order:3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{text-align:left;line-height:1.2;padding:8px 10px}
.grid small{display:block;font-weight:500;opacity:.75}
.dialog{background:var(--paper);border:3px solid var(--navy);border-radius:14px;padding:14px 16px;font-size:1.15rem;line-height:1.55}
.dialog b{color:var(--teal)}
.dialog .who{font-weight:900;margin-right:6px}
.dialog .hide{filter:blur(8px);user-select:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.85rem;min-height:1.2em}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22vw;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
.flash.on{opacity:.9;transition:none}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.shots canvas{width:150px;height:auto;border:3px solid #fff;border-radius:8px;cursor:pointer;background:#000}
.lightbox{position:fixed;inset:0;background:rgba(14,29,42,.92);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;cursor:pointer}
.lightbox canvas{max-width:100%;max-height:100%;border-radius:10px}
</style>
</head>
<body>
<header><h1>Nurse's Office</h1><span>Make an illness face, then talk with your partner.</span></header>
<main>
  <section class="stage">
    <div class="screen">
      <canvas id="c" width="1280" height="720"></canvas>
      <video id="v" playsinline muted></video>
      <div class="flash" id="flash"></div>
      <div class="count" id="count" hidden></div>
      <div class="overlay" id="start">
        <p><strong>Your camera stays on this Chromebook.</strong><br>No photos or videos are saved or sent.</p>
        <button class="primary" id="go">Start camera</button>
        <p class="status" id="msg"></p>
      </div>
    </div>
    <p class="status" id="info"></p>
    <div class="shots" id="shots"></div>
    <p class="status">Photos stay on this page only. They are never saved or sent, and they disappear when you reload.</p>
  </section>

  <div class="lightbox" id="lb" hidden></div>
  <aside class="side">
    <div class="grid" id="btns"></div>
    <div class="row">
      <button id="snap">📸 Snapshot</button>
      <button id="clear" hidden>Clear photos</button>
      <button id="rand">Random illness</button>
      <button id="guess">Guess mode: off</button>
      <button id="reveal" hidden>Show answer</button>
    </div>
    <div class="dialog" id="dlg">Pick an illness to start.</div>
  </aside>
</main>

<script type="module">
import {FaceLandmarker,HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $=id=>document.getElementById(id);
const V=$('v'),C=$('c'),ctx=C.getContext('2d');

const ILL=[
 {id:'pale',jp:'顔色が悪い',name:'Pale',cue:"You look pale.",ans:"I feel sick."},
 {id:'dizzy',jp:'めまい',name:'Dizzy',cue:"You look dizzy.",ans:"I feel dizzy."},
 {id:'fever',jp:'熱',name:'Fever',cue:"You look hot.",ans:"I have a fever."},
 {id:'headache',jp:'頭痛',name:'Headache',cue:"You look tired.",ans:"I have a headache."},
 {id:'stomach',jp:'腹痛',name:'Stomachache',cue:"You look sick.",ans:"I have a stomachache."},
 {id:'nosebleed',jp:'鼻血',name:'Bloody nose',cue:"Oh no! Your nose!",ans:"I have a nosebleed.",adv:"sit down and lean forward"},
 {id:'runny',jp:'鼻水',name:'Runny nose',cue:"You're sniffling.",ans:"I have a runny nose.",adv:"use a tissue"},
 {id:'cut',jp:'指を切った',name:'Cut finger',cue:"Your finger is bleeding.",ans:"I cut my finger.",adv:"wash it"},
 {id:'toothache',jp:'歯痛',name:'Toothache',cue:"Your cheek is swollen.",ans:"I have a toothache.",adv:"see a dentist"},
 {id:'cold',jp:'風邪・せき',name:'Cold and cough',cue:"You're coughing a lot.",ans:"I have a cold.",adv:"go home and rest"},
 {id:'blackeye',jp:'目のあざ',name:'Black eye',cue:"Your eye! What happened?",ans:"I have a black eye.",adv:"put ice on it"},
 {id:'bump',jp:'たんこぶ',name:'Bump on the head',cue:"What happened to your head?",ans:"I hit my head.",adv:"go to the nurse's office"},
 {id:'sunburn',jp:'日焼け',name:'Sunburn',cue:"Your face is red.",ans:"I got sunburned.",adv:"stay in the shade"},
 {id:'hayfever',jp:'花粉症',name:'Hay fever',cue:"Bless you!",ans:"I have hay fever.",adv:"take some medicine"},
 {id:'earache',jp:'耳の痛み',name:'Earache',cue:"You're holding your ear.",ans:"I have an earache.",adv:"see a doctor"},
 {id:'bite',jp:'虫刺され',name:'Insect bite',cue:"Your cheek is red.",ans:"I got bitten by a mosquito.",adv:"put some cream on it"}
];
let cur=null,guess=false,revealed=false,landmarker=null,lm=null,lastT=-1;
let fsRes=null,handLandmarker=null,handLoading=false,handLm=null,lastH=-1;

/* ---------- UI ---------- */
const btns=$('btns');
ILL.forEach(i=>{const b=document.createElement('button');b.dataset.id=i.id;b.innerHTML=`${i.name}<small>${i.jp}</small>`;b.onclick=()=>pick(i);btns.appendChild(b);});
function pick(i){
  cur=i;revealed=false;
  document.querySelectorAll('.grid button').forEach(b=>b.classList.toggle('on',b.dataset.id===i.id));
  renderDlg();
}
function renderDlg(){
  if(!cur){$('dlg').textContent='Pick an illness to start.';return;}
  const hide=guess&&!revealed?' class="hide"':'';
  $('dlg').innerHTML=
   `<div><span class="who">A:</span>What's the matter?<span${hide}> ${cur.cue}</span></div>`+
   `<div><span class="who">B:</span><span${hide}>${cur.ans}</span></div>`+
   `<div><span class="who">A:</span>Are you OK? I think you <b>should</b> ${cur.adv||'take a rest'}.</div>`;
  $('reveal').hidden=!(guess&&!revealed);
}
$('rand').onclick=()=>{let n;do{n=ILL[Math.floor(Math.random()*ILL.length)]}while(n===cur);pick(n);};
$('guess').onclick=()=>{guess=!guess;revealed=false;$('guess').textContent='Guess mode: '+(guess?'on':'off');$('guess').classList.toggle('on',guess);renderDlg();};
$('reveal').onclick=()=>{revealed=true;renderDlg();};

/* ---------- Snapshots (kept in memory only) ---------- */
const MAXSHOTS=8;let snapBusy=false;
$('snap').onclick=()=>{
  if(!V.srcObject||!$('start').hidden||snapBusy)return;
  snapBusy=true;let n=3;const el=$('count');el.hidden=false;el.textContent=n;
  const iv=setInterval(()=>{
    n--;
    if(n>0){el.textContent=n;return;}
    clearInterval(iv);el.hidden=true;takeShot();snapBusy=false;
  },1000);
};
function takeShot(){
  const w=C.width,h=C.height,s=document.createElement('canvas');
  s.width=w;s.height=h;
  const x=s.getContext('2d');x.drawImage(C,0,0);
  if(cur&&!(guess&&!revealed)){
    const fs=Math.round(h*.07);
    x.fillStyle='rgba(22,50,74,.85)';x.fillRect(0,h-fs*1.6,w,fs*1.6);
    x.fillStyle='#fff';x.font=`700 ${fs}px sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(`"${cur.ans}"`,w/2,h-fs*.8);
  }
  const fl=$('flash');fl.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>fl.classList.remove('on')));
  s.title='Click to enlarge';s.onclick=()=>{
    const b=document.createElement('canvas');b.width=w;b.height=h;b.getContext('2d').drawImage(s,0,0);
    $('lb').innerHTML='';$('lb').appendChild(b);$('lb').hidden=false;
  };
  const box=$('shots');box.appendChild(s);
  while(box.children.length>MAXSHOTS)box.removeChild(box.firstChild);
  $('clear').hidden=false;
}
$('lb').onclick=()=>{$('lb').hidden=true;};
$('clear').onclick=()=>{$('shots').innerHTML='';$('clear').hidden=true;};

/* ---------- Camera + face tracking ---------- */
$('go').onclick=async()=>{
  $('go').disabled=true;$('msg').textContent='Starting camera…';
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    V.srcObject=s;await V.play();
  }catch(e){
    let message = 'Camera could not start. ';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      message += 'This page needs HTTPS and a browser that supports camera access. Open the published HTTPS page directly.';
    } else if (e && (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError' || e.name === 'SecurityError')) {
      if (window.self !== window.top) {
        message += 'Google Sites may be blocking camera access inside the embedded frame. Open this activity directly in a new tab, or use an embed that grants camera permission. Also check Chrome site permissions.';
      } else {
        message += 'Allow camera access in Chrome site settings, then reload the page.';
      }
    } else if (e && e.name === 'NotFoundError') {
      message += 'No camera was found on this device.';
    } else if (e && e.name === 'NotReadableError') {
      message += 'The camera may already be in use by another app. Close other camera apps and try again.';
    } else {
      message += 'Check Chrome camera permissions and make sure no other app is using the camera.';
    }
    $('msg').textContent = message;
    $('go').disabled=false;return;
  }
  $('start').hidden=true;
  $('info').textContent='Loading face tracking…';
  requestAnimationFrame(frame);
  loadTracker();
};
async function loadTracker(){
  try{
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");fsRes=fs;
    const model="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
    for(const d of ["GPU","CPU"]){
      try{landmarker=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:"VIDEO",numFaces:1});break;}catch(e){}
    }
    $('info').textContent=landmarker?'':'Face tracking did not load. Effects will appear in the middle of the screen.';
  }catch(e){$('info').textContent='Face tracking did not load. Effects will appear in the middle of the screen.';}
}

async function loadHand(){
  handLoading=true;$('info').textContent='Loading hand tracking…';
  const model="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  for(const d of ["GPU","CPU"]){
    try{handLandmarker=await HandLandmarker.createFromOptions(fsRes,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:"VIDEO",numHands:1});break;}catch(e){}
  }
  $('info').textContent=handLandmarker?'':'Hand tracking did not load. Try reloading the page.';
}

/* ---------- Geometry ---------- */
function face(w,h){
  if(!lm){return{ok:false,cx:w/2,cy:h*.45,rx:w*.14,ry:w*.18,top:{x:w/2,y:h*.45-w*.18},chin:{x:w/2,y:h*.45+w*.18},
    lt:{x:w/2-w*.12,y:h*.3},rt:{x:w/2+w*.12,y:h*.3},lc:{x:w/2-w*.09,y:h*.5},rc:{x:w/2+w*.09,y:h*.5},
    le:{x:w/2-w*.06,y:h*.4},re:{x:w/2+w*.06,y:h*.4},mo:{x:w/2,y:h*.56},no:{x:w/2,y:h*.49},nl:{x:w/2-w*.015,y:h*.49},nr:{x:w/2+w*.015,y:h*.49}};}
  const P=i=>({x:(1-lm[i].x)*w,y:lm[i].y*h});
  const avg=(a,b)=>{const p=P(a),q=P(b);return{x:(p.x+q.x)/2,y:(p.y+q.y)/2}};
  const T=P(10),B=P(152),L=P(234),R=P(454);
  return{ok:true,cx:(L.x+R.x)/2,cy:(T.y+B.y)/2,rx:Math.abs(R.x-L.x)/2,ry:Math.abs(B.y-T.y)/2,top:T,chin:B,
    lt:P(54),rt:P(284),lc:P(205),rc:P(425),le:avg(33,133),re:avg(362,263),mo:P(14),no:P(2),nl:P(98),nr:P(327)};
}

/* ---------- Drawing helpers ---------- */
function video(dx=0,dy=0,filter='none',alpha=1){
  const w=C.width,h=C.height;
  ctx.save();ctx.globalAlpha=alpha;ctx.filter=filter;ctx.translate(w+dx,dy);ctx.scale(-1,1);ctx.drawImage(V,0,0,w,h);ctx.restore();
}
function faceGlow(f,color,a,scale=1.05){
  const g=ctx.createRadialGradient(f.cx,f.cy,f.ry*.15,f.cx,f.cy,f.ry*scale);
  g.addColorStop(0,color.replace('A',a));g.addColorStop(.75,color.replace('A',a*.8));g.addColorStop(1,color.replace('A',0));
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(f.cx,f.cy,f.rx*1.15,f.ry*1.05,0,0,Math.PI*2);ctx.fill();
}
function blob(x,y,r,color,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color.replace('A',a));g.addColorStop(1,color.replace('A',0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function emoji(ch,x,y,size,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,0,0);ctx.restore();
}
function spiral(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.beginPath();for(let a=0;a<Math.PI*6;a+=.2){const rr=r*a/(Math.PI*6);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
  ctx.lineWidth=Math.max(2,r*.12);ctx.strokeStyle='#16324a';ctx.stroke();ctx.restore();
}

function bulge(x,y,r,k,filter='none'){
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  ctx.translate(x,y);ctx.scale(k,k);ctx.translate(-x,-y);video(0,0,filter);ctx.restore();
}
function ring(x,y,r,color){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,r*.12);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore();}
function shout(str,x,y,size){
  ctx.save();ctx.font=`900 ${size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=size*.14;ctx.strokeStyle='#e8604c';ctx.fillStyle='#fff';
  ctx.strokeText(str,x,y);ctx.fillText(str,x,y);ctx.restore();
}
const topY=f=>Math.max(f.rx*.45,f.top.y-f.ry*.1);

/* ---------- Effects ---------- */
const FX={
 pale(f,t){
  video(0,0,'saturate(.2) brightness(1.18) contrast(.85)');
  faceGlow(f,'rgba(205,222,245,A)',.45);
  blob(f.cx,f.cy+f.ry*.1,f.rx*1.6,'rgba(120,140,180,A)',.12);
 },
 dizzy(f,t){
  video(0,0,'blur(1.5px) saturate(.9)');
  video(Math.sin(t*2.6)*C.width*.025,Math.cos(t*2.1)*C.height*.012,'blur(2px)',.4);
  [f.le,f.re].forEach(e=>{blob(e.x,e.y,f.rx*.3,'rgba(255,255,255,A)',.7);spiral(e.x,e.y,f.rx*.2,t*6);});
  for(let i=0;i<5;i++){const a=t*2.2+i*Math.PI*2/5;
    emoji('⭐',f.cx+Math.cos(a)*f.rx*1.05,f.top.y-f.ry*.02+Math.sin(a)*f.ry*.16,f.rx*.3);}
 },
 fever(f,t){
  video(0,0,'sepia(.35) saturate(1.8) hue-rotate(-12deg)');
  faceGlow(f,'rgba(255,50,30,A)',.35);
  [f.lc,f.rc].forEach(c=>blob(c.x,c.y,f.rx*.55,'rgba(255,40,40,A)',.55));
  for(let i=0;i<3;i++){const p=(t*.45+i/3)%1;
    emoji('💧',f.top.x+(i-1)*f.rx*.6,f.top.y+f.ry*.1+p*f.ry*.9,f.rx*.22);}
  emoji('🌡️',f.mo.x+f.rx*.35,f.mo.y,f.rx*.55,-.7);
 },
 headache(f,t){
  video(0,0,'brightness(.88) contrast(1.05)');
  const p=(Math.sin(t*5)+1)/2,w=C.width,h=C.height;
  const v=ctx.createRadialGradient(w/2,h/2,h*.25,w/2,h/2,h*.85);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,w,h);
  [f.lt,f.rt].forEach(c=>blob(c.x,c.y,f.rx*(.55+.35*p),'rgba(255,40,30,A)',.3+.45*p));
  emoji('💢',f.lt.x-f.rx*.2,f.lt.y-f.ry*.15,f.rx*(.3+.12*p));
  emoji('💢',f.rt.x+f.rx*.2,f.rt.y-f.ry*.15,f.rx*(.3+.12*p));
 },
 nosebleed(f,t){
  video(0,0,'saturate(.85) brightness(1.05)');
  const lw=Math.max(3,f.rx*.06),len=f.ry*(.3+.08*Math.sin(t*2));
  ctx.save();ctx.lineCap='round';
  [f.nl,f.nr].forEach(n=>{
    const ex=n.x+(f.mo.x-n.x)*.3,ey=Math.min(n.y+len,f.mo.y-lw);
    ctx.strokeStyle='rgba(165,0,12,.95)';ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.quadraticCurveTo(n.x,(n.y+ey)/2,ex,ey);ctx.stroke();
    ctx.fillStyle='rgba(165,0,12,.95)';ctx.beginPath();ctx.arc(ex,ey,lw*.75,0,Math.PI*2);ctx.fill();
  });
  for(let i=0;i<3;i++){const p=(t*.6+i/3)%1;
    ctx.fillStyle=`rgba(175,0,12,${1-p*.5})`;ctx.beginPath();ctx.arc(f.no.x+(i-1)*lw*1.4,f.mo.y+p*f.ry*.9,lw*.8*(1-p*.4),0,Math.PI*2);ctx.fill();}
  ctx.restore();
 },
 runny(f,t){
  video(0,0,'saturate(1.1)');
  blob(f.no.x,f.no.y-f.ry*.05,f.rx*.5,'rgba(255,70,70,A)',.5);
  const lw=Math.max(3,f.rx*.05),p=(Math.sin(t*1.6)+1)/2,len=f.ry*(.15+.22*p);
  ctx.save();ctx.lineCap='round';
  [f.nl,f.nr].forEach(n=>{
    const ex=n.x,ey=n.y+len;
    ctx.strokeStyle='rgba(190,232,150,.8)';ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.fillStyle='rgba(200,240,160,.85)';ctx.beginPath();ctx.arc(ex,ey,lw*(.9+.5*p),0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(ex-lw*.3,ey-lw*.3,lw*.3,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();
  emoji('🤧',f.cx+f.rx*1.35,f.top.y+f.ry*.25,f.rx*.5);
 },
 cut(f,t){
  video();
  if(!handLm){
    const w=C.width,h=C.height,fs=Math.round(h*.05);
    ctx.font=`700 ${fs}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const msg='Hold up your hand ✋ with one finger pointing up';
    const tw=ctx.measureText(msg).width+fs;
    ctx.fillStyle='rgba(22,50,74,.8)';ctx.fillRect(w/2-tw/2,h-fs*2.2,tw,fs*1.5);
    ctx.fillStyle='#fff';ctx.fillText(msg,w/2,h-fs*1.45);return;
  }
  const P=i=>({x:(1-handLm[i].x)*C.width,y:handLm[i].y*C.height});
  const tip=P(8),dip=P(7),pip=P(6),u=Math.hypot(tip.x-pip.x,tip.y-pip.y)||40;
  const m={x:(tip.x+dip.x)/2,y:(tip.y+dip.y)/2};
  const a=Math.atan2(tip.y-dip.y,tip.x-dip.x)+Math.PI/2,d=u*.22;
  blob(m.x,m.y,u*.4,'rgba(200,0,15,A)',.6);
  ctx.save();ctx.lineCap='round';
  ctx.strokeStyle='#a5000f';ctx.lineWidth=Math.max(3,u*.05);

/* ---------- Main loop ---------- */
function frame(){
  requestAnimationFrame(frame);
  if(V.readyState<2||!V.videoWidth)return;
  if(C.width!==V.videoWidth||C.height!==V.videoHeight){C.width=V.videoWidth;C.height=V.videoHeight;}
  if(landmarker&&V.currentTime!==lastT){
    lastT=V.currentTime;
    try{const r=landmarker.detectForVideo(V,performance.now());lm=r.faceLandmarks&&r.faceLandmarks[0]||null;}catch(e){lm=null;}
  }
  if(cur&&cur.id==='cut'){
    if(!handLandmarker&&fsRes&&!handLoading)loadHand();
    if(handLandmarker&&V.currentTime!==lastH){
      lastH=V.currentTime;
      try{const r=handLandmarker.detectForVideo(V,performance.now());handLm=r.landmarks&&r.landmarks[0]||null;}catch(e){handLm=null;}
    }
  }
  const f=face(C.width,C.height),t=performance.now()/1000;
  if(cur){FX[cur.id](f,t);}else{video();}
  ctx.filter='none';ctx.globalAlpha=1;
}
